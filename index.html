<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit Saber VR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ui">
  <h1>CORTAR FRUTAS VR</h1>

  <p id="msg">Verificando compatibilidade com realidade virtual...</p>

  <button id="enter" disabled>
    ENTRAR NA REALIDADE VIRTUAL
  </button>
  
  <button id="testDesktop" style="display:none; margin-top:12px;
  padding:12px 28px; font-size:1rem; background:#333; color:#fff;
  border:1px solid #00e5ff; border-radius:8px; cursor:pointer;">
  ▶ TESTAR NO DESKTOP (mouse)
  </button>

  <p id="desktopHelp">
    No computador, utilize o mouse para jogar.
    No Meta Quest, utilize os controles VR.
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
